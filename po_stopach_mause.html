<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Po stopách Mause</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --night:#120911;
      --wine:#7f1426;
      --wine2:#a01f34;
      --gold:#f0bd56;
      --paper:#fff6e4;
      --ink:#261016;
      --blue:#1265d8;
      --red:#c51f2f;
      --green:#188a3c;
      --shadow:rgba(0,0,0,.45);
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      padding:14px;
      font-family: Georgia, "Times New Roman", serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(240,189,86,.34), transparent 18%),
        radial-gradient(circle at 80% 10%, rgba(255,255,255,.12), transparent 14%),
        linear-gradient(135deg, #10070d 0%, #3a101d 58%, #070408 100%);
      display:flex;
      justify-content:center;
      align-items:stretch;
    }
    .app {
      width:min(1040px,100%);
      min-height:calc(100vh - 28px);
      background:
        linear-gradient(rgba(255,246,228,.94), rgba(255,246,228,.96)),
        repeating-linear-gradient(45deg, rgba(127,20,38,.04), rgba(127,20,38,.04) 8px, transparent 8px, transparent 18px);
      border:7px double var(--gold);
      border-radius:26px;
      box-shadow:0 24px 80px var(--shadow);
      padding:22px;
      position:relative;
      overflow:hidden;
    }
    .app::before {
      content:"";
      position:absolute;
      inset:14px;
      border:1px solid rgba(127,20,38,.18);
      border-radius:18px;
      pointer-events:none;
    }
    h1 {
      margin:8px 0 4px;
      text-align:center;
      color:var(--wine);
      font-size:clamp(34px,5.5vw,62px);
      text-shadow:0 2px 0 rgba(240,189,86,.45);
      letter-spacing:.4px;
    }
    .subtitle {
      text-align:center;
      color:#6a303a;
      font-size:18px;
      margin:0 0 18px;
    }
    .card {
      background:rgba(255,255,255,.76);
      border:2px solid rgba(127,20,38,.22);
      border-radius:22px;
      padding:20px;
      margin:14px 0;
      box-shadow:0 10px 28px rgba(61,20,28,.12);
    }
    .startCard {
      max-width:760px;
      margin:20px auto 0;
      padding:24px;
    }
    .row {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    label {
      display:block;
      font-weight:bold;
      margin-bottom:7px;
      color:#4b2028;
      font-size:18px;
    }
    input {
      width:100%;
      padding:14px 15px;
      border-radius:15px;
      border:2px solid rgba(127,20,38,.36);
      font-size:19px;
      background:#fff;
      outline:none;
    }
    input:focus {
      border-color:var(--wine2);
      box-shadow:0 0 0 4px rgba(160,31,52,.14);
    }
    button, a.btn {
      cursor:pointer;
      border:0;
      border-radius:18px;
      padding:16px 24px;
      font-weight:bold;
      font-size:20px;
      color:white;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing:.3px;
      transition:transform .08s ease, filter .12s ease;
    }
    button:active, a.btn:active { transform:translateY(2px); }
    .btnTest {
      background:linear-gradient(135deg, #a71934, #6f1022);
      box-shadow:0 6px 0 #4d0b17, 0 10px 24px rgba(127,20,38,.28);
    }
    .btnTable {
      background:linear-gradient(135deg, #2d6cdf, #17408c);
      box-shadow:0 6px 0 #102c61, 0 10px 24px rgba(18,101,216,.25);
    }
    .btnMenu {
      background:linear-gradient(135deg, #7b5422, #4c3212);
      box-shadow:0 6px 0 #2e1d0a;
    }
    button:hover, a.btn:hover { filter:brightness(1.06); }
    button:disabled { opacity:.65; cursor:not-allowed; transform:none; }
    .center { text-align:center; }
    .hidden { display:none !important; }
    .startButtons {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      margin-top:22px;
    }
    .topbar {
      display:grid;
      grid-template-columns:1fr 1.1fr 1fr;
      gap:12px;
      align-items:center;
      margin:10px 0 14px;
    }
    .pill {
      background:linear-gradient(135deg, #f8e6bd, #efd18a);
      border:1px solid rgba(127,20,38,.25);
      padding:10px 13px;
      border-radius:999px;
      color:#562730;
      font-weight:bold;
      text-align:center;
      box-shadow:0 4px 12px rgba(61,20,28,.10);
    }
    #timeText {
      font-size:clamp(22px,3.2vw,34px);
      color:#7f1426;
      padding:10px 16px;
      border:2px solid rgba(127,20,38,.34);
      text-shadow:0 2px 0 rgba(255,255,255,.55);
    }
.questionCard {
      position:relative;
      padding:24px;
      background:
        radial-gradient(circle at top left, rgba(240,189,86,.18), transparent 34%),
        rgba(255,255,255,.80);
    }
    .question {
      font-size:clamp(23px,3vw,33px);
      line-height:1.35;
      margin:8px 0 22px;
      color:#260c13;
      font-weight:bold;
      text-align:center;
    }
    .answers {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    .answer {
      min-height:92px;
      text-align:left;
      background:linear-gradient(135deg, #fffefb, #f8ead0);
      color:var(--ink);
      box-shadow:0 5px 0 rgba(127,20,38,.18), 0 9px 20px rgba(0,0,0,.08);
      border:2px solid rgba(127,20,38,.26);
      font-size:19px;
      line-height:1.25;
      padding:15px 16px;
    }

    .answer:disabled {
      opacity:1;
      cursor:default;
      filter:none;
    }

    @media (hover: hover) and (pointer: fine) {
      .answer:hover {
        border-color:var(--wine2);
        transform:translateY(-1px);
      }
    }

    .answer:focus,
    .answer:active {
      outline:none;
      transform:none;
    }

    .answer {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .answer.correctReveal {
      background:linear-gradient(135deg, #e4f0ff, #5fa1ff) !important;
      border-color:var(--blue) !important;
      color:#041f52 !important;
      box-shadow:0 5px 0 #0d4fae, 0 0 0 6px rgba(18,101,216,.20) !important;
    }
    .answer.wrongReveal {
      background:linear-gradient(135deg, #ffd1d1, #df2636) !important;
      border-color:var(--red) !important;
      color:#ffffff !important;
      box-shadow:0 5px 0 #8d1520, 0 0 0 6px rgba(197,31,47,.22) !important;
    }
    .feedback {
      margin-top:18px;
      min-height:46px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:clamp(24px,3.4vw,36px);
      font-weight:bold;
      text-align:center;
    }
    .feedback.good { color:var(--green); }
    .feedback.bad { color:var(--red); }
    .feedback.blue { color:var(--blue); }
    .result-big {
      font-size:clamp(32px,5vw,54px);
      color:var(--wine);
      font-weight:bold;
      margin:12px 0;
      text-shadow:0 2px 0 rgba(240,189,86,.45);
    }

    .resultScore {
      margin: 18px auto;
      max-width: 460px;
      padding: 18px 20px;
      border-radius: 20px;
      background: linear-gradient(135deg,#fff7d6,#f2d076);
      border: 3px solid #d2a22b;
      box-shadow: 0 9px 24px rgba(0,0,0,.16);
    }
    .resultLabel {
      font-size: 22px;
      font-weight: bold;
      color: #7f1426;
      margin-bottom: 8px;
      letter-spacing: .5px;
    }
    .resultValue {
      font-size: clamp(42px,7vw,62px);
      font-weight: bold;
      color: #1265d8;
      line-height: 1;
    }
    .resultGrade {
      font-size: clamp(54px,9vw,78px);
      font-weight: bold;
      color: #188a3c;
      line-height: 1;
    }

    .blockedMessage {
      margin-top:18px;
      padding:16px;
      border-radius:16px;
      background:#ffe1e1;
      border:3px solid var(--red);
      color:#8d1111;
      font-size:22px;
      font-weight:bold;
      text-align:center;
    }
    .checkingMessage {
      margin-top:18px;
      color:#7f1426;
      font-weight:bold;
      text-align:center;
    }

    .small { color:#684047; font-size:14px; }
    .bottomMenu {
      margin-top:22px;
      padding-top:16px;
      border-top:2px solid rgba(127,20,38,.18);
      display:flex;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
    }
    @media(max-width:720px){
      body{padding:7px;}
      .app{padding:13px; border-width:4px;}
      .row, .startButtons, .topbar, .answers{grid-template-columns:1fr;}
      button, a.btn{width:100%;}
      .answer{font-size:17px; min-height:74px;}
      .questionCard{padding:16px;}
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Po stopách Mause</h1>
  <div class="subtitle">test skutečné četby</div>

  <section id="screenStart" class="card startCard">
    <div class="row">
      <div>
        <label for="surname">Příjmení</label>
        <input id="surname" autocomplete="family-name" placeholder="např. Novák">
      </div>
      <div>
        <label for="className">Třída</label>
        <input id="className" placeholder="např. 2.A">
      </div>
    </div>

    <div class="startButtons">
      <button class="btnTest" id="startBtn" type="button">TEST</button>
      <a class="btn btnTable" href="https://docs.google.com/spreadsheets/d/1_dtTEdaPKPPNqQvlmE_LKqeoZmWMQ9w7JfCWuKyD1EA/edit?usp=sharing" target="_blank" rel="noopener">VÝSLEDKOVÁ TABULKA</a>
    </div>
    <p id="startStatus" class="small center"></p>
  </section>

  <section id="screenQuiz" class="hidden">
    <div class="topbar">
      <div class="pill" id="progress">Otázka 1/20</div>
      <div>
        <div class="pill" id="timeText">Čas: 20 s</div>
      </div>
      <div class="pill" id="score">Body: 0</div>
    </div>

    <div class="card questionCard">
      <div id="question" class="question"></div>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback"></div>
    </div>
  </section>

  <section id="screenResult" class="card startCard hidden">
    <div class="center">
      <div class="result-big" id="finalTitle"></div>
      <div id="finalText"></div>
      <p id="sendStatus" class="small"></p>
      <div class="bottomMenu">
        <button class="btnMenu" onclick="goMenu()">HLAVNÍ MENU</button>
        <a class="btn btnTable" href="https://docs.google.com/spreadsheets/d/1_dtTEdaPKPPNqQvlmE_LKqeoZmWMQ9w7JfCWuKyD1EA/edit?usp=sharing" target="_blank" rel="noopener">VÝSLEDKOVÁ TABULKA</a>
      </div>
    </div>
  </section>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyOR9AyqAgzzHaakd0RYDdP906iyHbkNko30yWRgnmDNelQGUNq_5yTbrlNClpRo65b/exec";
const APP_NAME = "Po stopách Mause";
const TABLE_URL = "https://docs.google.com/spreadsheets/d/1_dtTEdaPKPPNqQvlmE_LKqeoZmWMQ9w7JfCWuKyD1EA/edit?usp=sharing";
const TEST_COUNT = 20;
const PASS_LIMIT = 14;
const QUESTION_TIME = 20;
const REVEAL_TIME = 2000;

const QUESTIONS = [
  {
    q: "V jakém oboru Vladek podnikal před válkou?",
    a: ["Ve výrobě a obchodu s textilem", "Ve výrobě obuvi", "V potravinářství", "V bankovnictví"],
    correct: "Ve výrobě a obchodu s textilem"
  },
  {
    q: "Co se stalo s Anjinými deníky, které chtěl Art využít při práci na knize?",
    a: ["Zůstaly v Polsku.", "Anja je zničila před deportací.", "Vladek je po Anjině smrti spálil.", "Art je ztratil při stěhování."],
    correct: "Vladek je po Anjině smrti spálil."
  },
  {
    q: "Jak Art reaguje, když zjistí, co Vladek s Anjinými deníky udělal?",
    a: ["Odmítne s otcem dál mluvit.", "Nazve ho vrahem.", "Zničí část svých kreseb.", "Obviní ho ze lži."],
    correct: "Nazve ho vrahem."
  },
  {
    q: "Jak se jmenoval Artův bratr, který zemřel během války?",
    a: ["Ríša", "Lolek", "Mandel", "Herman"],
    correct: "Ríša"
  },
  {
    q: "Jak Artieho bratr zemřel?",
    a: ["Zahynul při transportu do Osvětimi.", "Byl zastřelen při útěku.", "Teta Tosha otrávila sebe i děti, aby se nedostali do rukou nacistů.", "Zemřel na tyfus v ghettu."],
    correct: "Teta Tosha otrávila sebe i děti, aby se nedostali do rukou nacistů."
  },
  {
    q: "Proč Art označuje svého zemřelého bratra za svého „fantomového rivala“?",
    a: ["Rodiče často porovnávali jejich školní výsledky.", "Bratr zůstal ve vzpomínkách rodičů idealizovaným dítětem, s nímž se Art nemohl skutečně poměřovat.", "Art žárlil na majetek, který měl jeho bratr zdědit.", "Art dlouho věřil, že jeho bratr válku přežil."],
    correct: "Bratr zůstal ve vzpomínkách rodičů idealizovaným dítětem, s nímž se Art nemohl skutečně poměřovat."
  },
  {
    q: "Jaký komiks vložený přímo do Mause pojednává o smrti Artovy matky?",
    a: ["Myš v pasti", "Vězeň na planetě peklo", "Poslední cesta Anji Spiegelmanové", "Osvětim"],
    correct: "Vězeň na planetě peklo"
  },
  {
    q: "V čem je vložený komiks „Vězeň na planetě peklo“ na první pohled odlišný od hlavního vyprávění Mause?",
    a: ["Je barevný.", "Postavy v něm nejsou zobrazeny jako zvířata a kresba má výrazně expresionistický charakter.", "Je nakreslen Vladkem.", "Neobsahuje žádný text."],
    correct: "Postavy v něm nejsou zobrazeny jako zvířata a kresba má výrazně expresionistický charakter."
  },
  {
    q: "Čím si Vladek po příchodu do Osvětimi zlepší své postavení u kápa?",
    a: ["Opravuje mu boty.", "Učí ho anglicky.", "Obstarává mu jídlo.", "Překládá mu z polštiny do němčiny."],
    correct: "Učí ho anglicky."
  },
  {
    q: "Jak se Vladek s Anjou pokusí dostat z okupovaného Polska do bezpečí?",
    a: ["Ukryjí se v nákladním vlaku.", "Zaplatí převaděčům, kteří je mají dostat do Maďarska.", "Pokusí se dostat lodí do Švédska.", "Použijí falešné německé vojenské doklady."],
    correct: "Zaplatí převaděčům, kteří je mají dostat do Maďarska."
  },
  {
    q: "Co se stane při pokusu Vladka a Anji dostat se s pomocí převaděčů do Maďarska?",
    a: ["Anja se odmítne vydat na cestu.", "Převaděči je zradí a Vladek s Anjou jsou zatčeni.", "Vladek přijde o falešné doklady.", "Na hranicích je pozná Anjin bývalý spolužák."],
    correct: "Převaděči je zradí a Vladek s Anjou jsou zatčeni."
  },
  {
    q: "Jak jsou v Mausovi nejčastěji zobrazováni nežidovští Poláci?",
    a: ["Jako psi", "Jako kočky", "Jako prasata", "Jako koně"],
    correct: "Jako prasata"
  },
  {
    q: "Co si Vladek a Anja symbolicky nasazují, když se vydávají za nežidovské Poláky?",
    a: ["Kočičí masky", "Prasečí masky", "Psí masky", "Ptačí masky"],
    correct: "Prasečí masky"
  },
  {
    q: "Která Vladkova vlastnost výrazně komplikuje jeho vztahy s Artem i Malou?",
    a: ["Chorobná šetrnost a neochota cokoli vyhodit", "Závislost na hazardních hrách", "Neustálé půjčování peněz", "Záliba v drahém oblečení"],
    correct: "Chorobná šetrnost a neochota cokoli vyhodit"
  },
  {
    q: "Proč Art říká, že ho při tvorbě knihy znepokojuje Vladkova chorobná šetrnost?",
    a: ["Protože se bojí, že kvůli ní Vladek přijde o majetek.", "Protože připomíná antisemitský stereotyp lakomého Žida.", "Protože Vladek odmítá za knihu Artovi zaplatit.", "Protože se tato vlastnost u Vladka objevila až ve stáří."],
    correct: "Protože připomíná antisemitský stereotyp lakomého Žida."
  },
  {
    q: "Co se Vladek pokouší udělat s otevřenými balíčky potravin, které už nechce?",
    a: ["Odnést je sousedům.", "Poslat je Malé.", "Vrátit je do obchodu.", "Schovat je ve sklepě."],
    correct: "Vrátit je do obchodu."
  },
  {
    q: "Jak je Art zobrazen v části vznikající po velkém úspěchu Mause?",
    a: ["Jako dítě v myší kleci", "Jako člověk s nasazenou myší maskou", "Jako myš převlečená za kočku", "Jako kreslíř bez obličeje"],
    correct: "Jako člověk s nasazenou myší maskou"
  },
  {
    q: "Co se nachází pod Artovým pracovním stolem ve scéně, v níž je zobrazen jako člověk s myší maskou?",
    a: ["Hromada nepoužitých kreseb", "Hromada mrtvých těl", "Otcovy magnetofonové pásky", "Roztrhané fotografie jeho rodiny"],
    correct: "Hromada mrtvých těl"
  },
  {
    q: "Jaký překvapivý omyl udělá Vladek úplně na konci knihy?",
    a: ["Zamění Auschwitz za Dachau.", "Osloví Arta jménem Ríša.", "Tvrdí, že Anja stále žije.", "Zapomene, že Art zaznamenává jeho příběh."],
    correct: "Osloví Arta jménem Ríša."
  },
  {
    q: "Co je na posledním obrazu knihy bezprostředně spojeno s ukončením Vladkova vyprávění?",
    a: ["Fotografie Ríši", "Vladkův vězeňský oděv", "Náhrobek Vladka a Anji", "Prázdná myší maska"],
    correct: "Náhrobek Vladka a Anji"
  },
  {
    q: "Jaké národnosti je Artieho manželka?",
    a: ["Polské", "Francouzské", "Německé", "Americké"],
    correct: "Francouzské"
  },
  {
    q: "Jakým neobvyklým názvem je v knize označena Osvětim?",
    a: ["Auschwitz Maus", "Auschwitz für Maus", "Mauschwitz", "Maussitz"],
    correct: "Mauschwitz"
  },
  {
    q: "Jaké zvíře Art nakonec používá pro svou manželku?",
    a: ["Žábu", "Myš", "Prase", "Psa"],
    correct: "Myš"
  },
  {
    q: "Proč je zobrazení Artieho manželky jako myši do jisté míry problematické?",
    a: ["Narodila se v Německu.", "Není židovského původu, ale konvertovala k judaismu.", "Sama chce být zobrazena jako kočka.", "Její rodiče byli Poláci."],
    correct: "Není židovského původu, ale konvertovala k judaismu."
  },
  {
    q: "Proč Vladek telefonicky tvrdí, že dostal infarkt, když jsou Artie s manželkou na dovolené?",
    a: ["Chce Artieho přimět, aby přijel, protože ho opustila Mala.", "Potřebuje odvézt do nemocnice.", "Chce Artieho přimět, aby mu půjčil peníze.", "Dozvěděl se, že zemřel jeden z jeho příbuzných."],
    correct: "Chce Artieho přimět, aby přijel, protože ho opustila Mala."
  },
  {
    q: "Kdo je Mala, s níž Vladek žije v době Artových návštěv?",
    a: ["Vladkova sestra", "Anjina sestřenice", "Vladkova druhá manželka", "Artova teta"],
    correct: "Vladkova druhá manželka"
  },
  {
    q: "Co mají Vladek a jeho druhá manželka společného?",
    a: ["Oba přežili holokaust.", "Oba pocházejí z Francie.", "Oba přišli do USA ještě před válkou.", "Oba se narodili po první světové válce."],
    correct: "Oba přežili holokaust."
  },
  {
    q: "Jakou podobu mají v Mausovi Američané?",
    a: ["Koček", "Psů", "Králíků", "Koní"],
    correct: "Psů"
  },
  {
    q: "Jak se Vladkovi podaří v Osvětimi navázat kontakt s Anjou?",
    a: ["Prostřednictvím tajně předávaných zpráv", "Prostřednictvím oficiální táborové pošty", "Během pravidelných společných návštěv", "Telefonicky z táborové kanceláře"],
    correct: "Prostřednictvím tajně předávaných zpráv"
  },
  {
    q: "Co se stane s Vladkem krátce po vypuknutí války během bojů s Němci?",
    a: ["Je raněn a převezen do nemocnice.", "Dostane se do německého zajetí.", "Dezertuje a vrátí se k Anje.", "Je odvelen do Sovětského svazu."],
    correct: "Dostane se do německého zajetí."
  }
];

let quiz = [];
let index = 0;
let points = 0;
let locked = false;
let started = false;
let finished = false;
let cheatTimer = null;
let timeLeft = QUESTION_TIME;
let timerInterval = null;
let revealTimeout = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let audioCtx = null;

function ensureAudio() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  } catch(e) {}
}

function sound(freq1, freq2, length=0.24, gainMax=0.50, type="triangle") {
  try {
    ensureAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.setValueAtTime(freq1, now);
    if (freq2 && freq2 !== freq1) {
      osc.frequency.exponentialRampToValueAtTime(freq2, now + length * 0.75);
    }

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(gainMax, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + length);

    osc.start(now);
    osc.stop(now + length + 0.04);
  } catch(e) {}
}

function soundGood() {
  sound(720, 980, .18, .42, "triangle");
  setTimeout(() => sound(980, 1320, .16, .42, "triangle"), 115);
  setTimeout(() => sound(1320, 1560, .14, .35, "triangle"), 230);
}

function soundBad() {
  // Mobilně slyšitelnější chyba: vyšší, ostrý, dvojitý sestupný tón.
  sound(620, 360, 0.22, 0.70, "square");
  setTimeout(() => sound(520, 260, 0.24, 0.70, "square"), 210);
}

function soundTick() {
  sound(520, 520, .05, .16, "sine");
}

function soundCheat() {
  sound(1400, 300, .30, .75, "sawtooth");
  setTimeout(() => sound(300, 1400, .30, .75, "sawtooth"), 300);
  setTimeout(() => sound(1400, 250, .42, .80, "sawtooth"), 620);
}

function soundEnd(pass) {
  pass ? soundGood() : soundBad();
}


function checkApplicationStatus() {
  return new Promise(resolve => {
    const callbackName = "stavAplikaceCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    const script = document.createElement("script");
    let finished = false;

    function cleanup() {
      try { delete window[callbackName]; } catch(e) { window[callbackName] = undefined; }
      if (script && script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(data) {
      if (finished) return;
      finished = true;
      cleanup();
      const stav = (data && data.stav ? String(data.stav) : "SPUŠTĚNO").trim().toUpperCase();
      resolve(stav);
    };

    script.onerror = function() {
      if (finished) return;
      finished = true;
      cleanup();
      resolve("SPUŠTĚNO");
    };

    const separator = WEB_APP_URL.includes("?") ? "&" : "?";
    script.src = WEB_APP_URL + separator + "action=status&callback=" + encodeURIComponent(callbackName) + "&t=" + Date.now();
    document.body.appendChild(script);

    setTimeout(() => {
      if (finished) return;
      finished = true;
      cleanup();
      resolve("SPUŠTĚNO");
    }, 4500);
  });
}

function showStartStatus(message, type) {
  const el = document.getElementById("startStatus");
  if (!el) return;
  el.textContent = message || "";
  el.className = type === "blocked" ? "blockedMessage" : (type === "checking" ? "checkingMessage" : "small center");
}

async function startQuiz() {
  ensureAudio();
  const surname = document.getElementById("surname").value.trim();
  const className = document.getElementById("className").value.trim();

  if (!surname || !className) {
    alert("Vyplň prosím příjmení i třídu.");
    return;
  }

  const startBtn = document.getElementById("startBtn");
  if (startBtn) startBtn.disabled = true;
  showStartStatus("Ověřuji, zda je aplikace spuštěna…", "checking");

  let stavAplikace = "SPUŠTĚNO";
  try {
    stavAplikace = await checkApplicationStatus();
  } catch(e) {
    stavAplikace = "SPUŠTĚNO";
  }

  if (stavAplikace === "ZABLOKOVÁNO" || stavAplikace === "ZABLOKOVANO") {
    showStartStatus("APLIKACI NELZE SPUSTIT – TEST JE DOČASNĚ ZABLOKOVÁN.", "blocked");
    if (startBtn) startBtn.disabled = false;
    return;
  }

  showStartStatus("", "");
  if (startBtn) startBtn.disabled = false;

  quiz = shuffle(QUESTIONS).slice(0, TEST_COUNT).map(item => ({...item, a: shuffle(item.a)}));
  index = 0;
  points = 0;
  locked = false;
  started = true;
  finished = false;

  document.getElementById("screenStart").classList.add("hidden");
  document.getElementById("screenResult").classList.add("hidden");
  document.getElementById("screenQuiz").classList.remove("hidden");

  renderQuestion();
}

function renderQuestion() {
  if (document.activeElement && typeof document.activeElement.blur === "function") {
    document.activeElement.blur();
  }
  clearTimers();
  locked = false;
  timeLeft = QUESTION_TIME;

  const item = quiz[index];
  document.getElementById("progress").textContent = `Otázka ${index + 1}/${quiz.length}`;
  document.getElementById("score").textContent = `Body: ${points}`;
  document.getElementById("question").textContent = item.q;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  updateTimerDisplay();

  const box = document.getElementById("answers");
  box.innerHTML = "";

  item.a.forEach(ans => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = ans;
    btn.style.pointerEvents = "auto";
    btn.onclick = () => chooseAnswer(btn, ans);
    box.appendChild(btn);
  });

  timerInterval = setInterval(() => {
    timeLeft -= 1;
    updateTimerDisplay();
    if (timeLeft <= 3 && timeLeft > 0) soundTick();
    if (timeLeft <= 0) {
      handleWrongOrTimeout();
    }
  }, 1000);
}

function updateTimerDisplay() {
  document.getElementById("timeText").textContent = `Čas: ${Math.max(0, timeLeft)} s`;
}

function chooseAnswer(btn, ans) {
  ensureAudio();
  if (locked || finished) return;
  locked = true;
  clearInterval(timerInterval);

  const item = quiz[index];
  const buttons = [...document.querySelectorAll(".answer")];
  buttons.forEach(b => b.disabled = true);

  if (ans === item.correct) {
    points++;
    btn.classList.add("correctReveal");
    document.getElementById("feedback").textContent = "SPRÁVNĚ";
    document.getElementById("feedback").className = "feedback good";
    document.getElementById("score").textContent = `Body: ${points}`;
    soundGood();
  } else {
    btn.classList.add("wrongReveal");
    const correctBtn = buttons.find(b => b.textContent === item.correct);
    if (correctBtn) correctBtn.classList.add("correctReveal");
    document.getElementById("feedback").textContent = "CHYBA";
    document.getElementById("feedback").className = "feedback bad";
    soundBad();
  }

  revealTimeout = setTimeout(nextQuestionAuto, REVEAL_TIME);
}

function handleWrongOrTimeout() {
  if (locked || finished) return;
  locked = true;
  clearInterval(timerInterval);

  const item = quiz[index];
  const buttons = [...document.querySelectorAll(".answer")];
  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === item.correct) b.classList.add("correctReveal");
  });

  document.getElementById("feedback").textContent = "ČAS VYPRŠEL";
  document.getElementById("feedback").className = "feedback bad";
  soundBad();

  revealTimeout = setTimeout(nextQuestionAuto, REVEAL_TIME);
}

function nextQuestionAuto() {
  index++;
  if (index >= quiz.length) finishQuiz(false);
  else renderQuestion();
}

function clearTimers() {
  clearInterval(timerInterval);
  clearTimeout(revealTimeout);
}


function getGrade(score) {
  if (score >= 18) return "1";
  if (score >= 16) return "2";
  if (score >= 14) return "3";
  if (score >= 12) return "4";
  return "5";
}

function finishQuiz(byCheat) {
  if (finished) return;
  finished = true;
  started = false;
  clearTimers();
  clearTimeout(cheatTimer);

  const passed = !byCheat && points >= PASS_LIMIT;
  const grade = byCheat ? "5" : getGrade(points);
  const vysledekText = byCheat ? "neplatné" : (passed ? "USPĚL" : "NEUSPĚL");
  const znamka = byCheat ? "5" : grade;
  const note = byCheat
    ? "Test ukončen: opuštění okna aplikace / podezření na podvod."
    : (passed ? `Splněno. Známka: ${grade}.` : `Nesplněno. Známka: ${grade}.`);

  document.getElementById("screenQuiz").classList.add("hidden");
  document.getElementById("screenResult").classList.remove("hidden");
  document.getElementById("finalTitle").textContent = byCheat ? "TEST UKONČEN" : vysledekText;
  document.getElementById("finalText").innerHTML = byCheat
    ? `
      <div class="resultScore">
        <div class="resultLabel">ZÍSKANÉ BODY</div>
        <div class="resultValue">${points}/${quiz.length}</div>
      </div>
      <div class="resultScore">
        <div class="resultLabel">ZNÁMKA</div>
        <div class="resultGrade">5</div>
      </div>
      <p class="small">Aplikace zaznamenala opuštění testu.</p>
    `
    : `
      <div class="resultScore">
        <div class="resultLabel">ZÍSKANÉ BODY</div>
        <div class="resultValue">${points}/${quiz.length}</div>
      </div>
      <div class="resultScore">
        <div class="resultLabel">ZNÁMKA</div>
        <div class="resultGrade">${grade}</div>
      </div>
      <p class="small">Limit pro úspěch: ${PASS_LIMIT}/${TEST_COUNT}.</p>
    `;

  if (byCheat) {
    soundCheat();
  } else {
    soundEnd(passed);
  }
  sendResult(znamka, note, vysledekText);
}

function goMenu() {
  clearTimers();
  document.getElementById("screenQuiz").classList.add("hidden");
  document.getElementById("screenResult").classList.add("hidden");
  document.getElementById("screenStart").classList.remove("hidden");
  document.getElementById("surname").value = "";
  document.getElementById("className").value = "";
  document.getElementById("surname").focus();
}

function sendResult(znamka, note, vysledekText) {
  const status = document.getElementById("sendStatus");

  if (!WEB_APP_URL) {
    status.textContent = "Výsledek nebyl odeslán – v HTML je nutné doplnit URL Apps Scriptu.";
    return;
  }

  const data = new URLSearchParams();
  data.append("timestamp", new Date().toISOString());
  data.append("aplikace", APP_NAME);
  data.append("trida", document.getElementById("className").value.trim());
  data.append("prijmeni", document.getElementById("surname").value.trim());
  data.append("jmeno", document.getElementById("surname").value.trim());
  data.append("vysledek", vysledekText || znamka);
  data.append("znamka", znamka);
  data.append("body", String(points));
  data.append("celkem", String(quiz.length));
  data.append("spravne", String(points));
  data.append("spatne", String(quiz.length - points));
  data.append("rezim", note.includes("opuštění") ? "PŘEKLIKNUTÍ" : "TEST");
  data.append("poznamka", note);
  data.append("odeslano", new Date().toLocaleString("cs-CZ"));
  data.append("technika", "skryty_formular_iframe");

  // Ověřená cesta z funkční aplikace Malý princ:
  // skutečné formulářové odeslání do skrytého iframe.
  const iframeName = "odesilaci_iframe";
  let iframe = document.querySelector('iframe[name="' + iframeName + '"]');
  if (!iframe) {
    iframe = document.createElement("iframe");
    iframe.name = iframeName;
    iframe.style.display = "none";
    document.body.appendChild(iframe);
  }

  const form = document.createElement("form");
  form.method = "POST";
  form.action = WEB_APP_URL;
  form.target = iframeName;
  form.style.display = "none";

  for (const [key, value] of data.entries()) {
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = key;
    input.value = value;
    form.appendChild(input);
  }

  document.body.appendChild(form);
  form.submit();
  status.textContent = "Výsledek byl odeslán do tabulky.";
  setTimeout(() => form.remove(), 1500);
}

/*
  Ochrana proti překliknutí:
  - krátké omylem vyvolané rozostření nestačí;
  - test se ukončí až při skutečném skrytí stránky delším než 1,2 s.
*/
document.addEventListener("visibilitychange", () => {
  if (!started || finished) return;

  if (document.hidden) {
    cheatTimer = setTimeout(() => {
      if (started && !finished && document.hidden) finishQuiz(true);
    }, 1200);
  } else {
    clearTimeout(cheatTimer);
  }
});


const startBtnElement = document.getElementById("startBtn");
if (startBtnElement) {
  startBtnElement.addEventListener("click", startQuiz);
}

window.addEventListener("pagehide", () => {
  if (started && !finished) finishQuiz(true);
});
</script>
